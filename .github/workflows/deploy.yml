name: CI/CD Pipeline - Azure & Neon DB Deployment

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies & Prisma Client
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m prisma generate

      - name: Run Backend Pytest Suite
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test_db"
        run: |
          cd backend
          python -m pytest

      - name: Build Docker Container Image
        run: |
          docker build -t greenfield-pos-backend:latest ./backend

  build-deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies & Build Angular PWA
        run: |
          cd frontend
          npm ci || npm install
          npm run build --if-present

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/frontend"
          output_location: "dist/greenfield-mart-pos-angular/browser"
